<!doctype html><meta charset="utf-8"><title>Imitação do site da WSE (para os testes)</title>
<div id="home"></div><div id="sidgad-liga-main-content"></div>
<script>
// Mesma estrutura do site verdadeiro: cartões na página inicial, ?liga=N&vista=calendar|clasificaciones, dados que aparecem com atraso.
const LIGAS = {339: "WSE CHAMPIONS LEAGUE MEN", 342: "WSE CHAMPIONS LEAGUE WOMEN", 351: "WSE CUP MEN", 352: "WSE CUP WOMEN", 353: "WSE TROPHY", 349: "WSE CONTINENTAL CUP MEN"};
const eq = (liga, vista, id, nome, lado, logo) => `<td class="sidgad-col-logo sidgad-col-logo-${lado}"><img src="https://sidgad.cloud/worldskate/images//logos_clubes/${logo}.png" alt="${nome}" class="sidgad-calendario-logo"></td><td class="sidgad-col-equipo sidgad-col-equipo-${lado}"><a class="sidgad-team-link sidgad-nav" href="/?liga=${liga}&amp;vista=${vista}&amp;equipo=${id}">${nome}</a></td>`;
const jogo = (l, d, h, c, f, res, extra = "") => `<tr class="sidgad-calendario-partido team-${c[0]} team-${f[0]}"><td class="sidgad-col-dia">${d}</td><td class="sidgad-col-hora">${h}</td>${eq(l, "calendar", c[0], c[1], "home", c[2])}${eq(l, "calendar", f[0], f[1], "away", f[2])}<td class="sidgad-col-bonus sidgad-col-bonus-home"></td><td class="sidgad-col-resultado">${res}</td><td class="sidgad-col-bonus sidgad-col-bonus-away"></td><td class="sidgad-col-accion sidgad-col-accion-details">${res ? '<button data-calendar-action="details" data-match-id="3438"></button>' : ""}</td><td class="sidgad-col-accion sidgad-col-accion-video">${extra}</td></tr>`;
const vazio = `<tr class="sidgad-calendario-partido"><td class="sidgad-col-dia"></td><td class="sidgad-col-hora"></td><td class="sidgad-col-logo sidgad-col-logo-home"></td><td class="sidgad-col-equipo sidgad-col-equipo-home"></td><td class="sidgad-col-logo sidgad-col-logo-away"></td><td class="sidgad-col-equipo sidgad-col-equipo-away"></td><td class="sidgad-col-bonus"></td><td class="sidgad-col-resultado"></td><td class="sidgad-col-bonus"></td><td></td><td></td></tr>`;
const ronda = t => `<tr class="sidgad-calendario-jornada"><td colspan="11">${t}</td></tr>`;
const T = {SCP: [1174, "SPORTING CP", "54_4"], OCB: [1181, "OC BARCELOS", "55"], FCP: [1172, "FC PORTO", "79"], SLB: [1175, "SL BENFICA", "56"], IGU: [1176, "IGUALADA RIGAT HC", "92_1"], TRI: [1177, "HOCKEY TRISSINO", "62_3"],
  JP: [1301, "JUVENTUDE PACENSE  DES COMPAG", "140"], UDO: [1302, "UD OLIVEIRENSE SIMOLDES", "141"], MON: [1303, "TEAMSERVICECAR MONZA", "150"], VOL: [1304, "CP VOLTREGÀ MOVENTO STERN", "151"]};
const CAL = {
  339: ronda("Round 1") + jogo(339, "25/11/2026", "20:30", T.IGU, T.TRI, "") + jogo(339, "26/11/2026", "20:00", T.FCP, T.SLB, "") + jogo(339, "26/11/2026", "20:00", T.SCP, T.OCB, "") + ronda("Round 2") + jogo(339, "10/12/2026", "", T.TRI, T.FCP, ""),
  351: ronda("QUARTERSFINALS") + vazio + vazio + ronda("QUARTERSFINALS") + vazio + vazio + ronda("ROUND OF 16") + jogo(351, "12/12/2026", "17:00", T.JP, T.UDO, "3:2", '<button data-calendar-action="video" data-video-type="youtube" data-video-url="aXZnmrEbvEI"></button>') + jogo(351, "12/12/2026", "", T.MON, T.VOL, "") + ronda("ROUND OF 16") + jogo(351, "23/01/2027", "", T.UDO, T.JP, "") + jogo(351, "23/01/2027", "20:00", T.VOL, T.MON, ""),
};
const linha = (l, pos, t, n) => `<tr data-team-id="${t[0]}"><td class="sidgad-clasif-pos">${pos}</td><td class="sidgad-clasif-equipo"><img src="https://sidgad.cloud/worldskate/images/logos_clubes/${t[2]}.png" alt=""><a class="sidgad-team-link sidgad-nav" href="/?liga=${l}&amp;vista=clasificaciones&amp;equipo=${t[0]}"><span class="sidgad-clasif-nombre">${t[1]}</span><span class="sidgad-clasif-corto"></span></a></td><td class="sidgad-clasif-pts">${n[0]}</td>${n.slice(1).map(x => `<td class="">${x}</td>`).join("")}</tr>`;
const CLS = {339: `<section class="sidgad-clasif-bloque"><h2 class="sidgad-calendario-fase sidgad-clasif-titulo">Overall standings</h2><div class="sidgad-clasif-wrap"><table class="sidgad-clasif-tabla"><thead><tr><th class="sidgad-clasif-grupo" colspan="2"></th><th class="sidgad-clasif-pts" title="Points">PTS</th><th title="Games played">GP</th><th title="Games won">W</th><th title="Games drawn">D</th><th title="Games lost">L</th><th title="Goals for">GF</th><th title="Goals against">GA</th><th title="Goal difference">GD</th></tr></thead><tbody>${linha(339, 1, T.SCP, [3, 1, 1, 0, 0, 5, 2, 3])}${linha(339, 2, T.FCP, [1, 1, 0, 1, 0, 2, 2, 0])}${linha(339, 3, [1190, "", "0"], [0, 0, 0, 0, 0, 0, 0, 0])}</tbody></table></div></section>`};
// ficha de jogo (mesma estrutura do site verdadeiro)
const L = "https://sidgad.cloud/worldskate/images/logos_clubes/";
const inc = (per, t, icone, logo, corpo) => `<div class="sidgad-mob-incident-row"><div class="sidgad-mob-col-time"><span class="sidgad-mob-period">P${per}</span><span class="sidgad-mob-clock">${t}</span></div><div class="sidgad-mob-col-icon">${icone}</div><div class="sidgad-mob-col-logo"><img src="${L}${logo}" class="sidgad-mob-team-logo"></div><div class="sidgad-mob-col-details">${corpo}</div></div>`;
const jg = (n, nome) => `<div class="sidgad-mob-player">#${n} <a class="sidgad-player-link sidgad-nav" href="#"><span class="sidgad-mob-bold">${nome.split(",")[0]},</span>${nome.split(",")[1]}</a></div>`;
const golo = (per, t, res, logo, eq, n, nome) => inc(per, t, `<span class="sidgad-bola sidgad-mob-action-icon"></span><span class="sidgad-mob-score-pill">${res}</span>`, logo, `<div class="sidgad-mob-title-goal">GOAL ${eq}</div>${jg(n, nome)}`);
const falta = (per, t, num, logo, eq) => inc(per, t, `<i class="fa-solid fa-hand sidgad-mob-action-icon sidgad-mob-icon-fault"></i><span class="sidgad-mob-falta-num">${num}</span>`, logo, `<div class="sidgad-mob-title-goal sidgad-mob-title-foul">PENALTY ${eq}</div>`);
const azul = (per, t, logo, eq, n, nome) => inc(per, t, `<i class="fa-solid fa-note-sticky sidgad-mob-action-icon sidgad-mob-icon-blue-card"></i>`, logo, `<div class="sidgad-mob-title-goal sidgad-mob-title-foul">BLUE CARD ${eq}</div>${jg(n, nome)}`);
const pausa = (per, t, logo, eq) => inc(per, t, `<i class="fa-solid fa-pause sidgad-mob-action-icon sidgad-mob-icon-timeout"></i>`, logo, `<div class="sidgad-mob-title-goal sidgad-mob-title-timeout">TIMEOUT<br>${eq}</div>`);
const remate = (per, t, tipo, logo, eq, n, nome, res) => inc(per, t, `<i class="fa-solid sidgad-mob-action-icon sidgad-mob-icon-${tipo === "pen" ? "penalty-shoot" : "direct-fault"}"></i>`, logo, `<div class="sidgad-mob-title-goal sidgad-mob-title-foul">${tipo === "pen" ? "PENALTY" : "DIRECT FREE HIT"} FOR ${eq}</div><div class="sidgad-mob-shooter">Taking the shot...</div>${jg(n, nome)}<div class="sidgad-mob-result">${res}</div>`);
const jl = (n, gr, ap, pr) => `<tr><td>${n}</td><td>${gr ? '<span class="sidgad-captain-badge">P</span>' : ""}</td><td><span class="sidgad-5i-badge"></span></td><td class="sidgad-col-name"><a class="sidgad-player-link sidgad-nav" href="#"><img src="https://flagcdn.com/w20/pt.png" class="sidgad-player-flag" alt=""> <span class="sidgad-player-last ">${ap}</span><span class="sidgad-player-first">${pr}</span></a></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
const tc = (cod, nome) => `<tr><td></td><td><span class="sidgad-captain-badge">${cod}</span></td><td class="sidgad-col-name" colspan="8"><img class="sidgad-player-flag"><span class="sidgad-tecnico-name">${nome}</span></td><td></td><td></td><td></td></tr>`;
const plantel = (id, eq, linhas, staff) => `<div class="sidgad-table-responsive"><table class="sidgad-roster-table"><tr><th class="sidgad-team-roster-header" id="${id}" colspan="13">${eq}</th></tr><tr><th>No.</th><th>P</th><th>5i</th><th class="sidgad-col-name"></th></tr>${linhas}<tr class="sidgad-roster-subheader"><th colspan="13">Coaching staff</th></tr>${staff}</table></div>`;
const FICHA = `<div class="sidgad-match-modal-top"><h2>Match details</h2></div>
<div class="sidgad-match-info-bar"><div class="sidgad-info-left"><span id="sidgad-modal-league-name">WSE CUP - ROUND OF 16 - </span><span id="sidgad-modal-date">12/12/2026 - 17:00</span></div><div class="sidgad-info-center"><span id="sidgad-modal-venue">PAVILHÃO MUNICIPAL DE PAÇOS DE FERREIRA</span></div><div class="sidgad-info-right"><span>REFEREES</span><span id="sidgad-modal-refs"><p>SILECCHIA, JOSEPH</p><p>STALLONE, FRANCESCO</p></span></div></div>
<div class="sidgad-modal-scoreboard"><div class="sidgad-modal-team sidgad-local"><div class="sidgad-modal-team-name" id="sidgad-modal-home-name"><a class="sidgad-team-link" href="/?liga=351&amp;equipo=1301">JUVENTUDE PACENSE</a></div><img id="sidgad-modal-home-logo" src="${L}140.png"></div><div class="sidgad-modal-hp-faults" id="sidgad-hp-home-faults">9</div><div class="sidgad-modal-score-center"><div class="sidgad-modal-score" id="sidgad-modal-score-text">3 - 2</div><div class="sidgad-modal-status">FINAL</div></div><div class="sidgad-modal-hp-faults" id="sidgad-hp-away-faults">10</div><div class="sidgad-modal-team sidgad-visit"><img id="sidgad-modal-away-logo" src="${L}141.png"><div class="sidgad-modal-team-name" id="sidgad-modal-away-name"><a class="sidgad-team-link" href="/?liga=351&amp;equipo=1302">UD OLIVEIRENSE</a></div></div></div>
<div id="sidgad-ficha-alineaciones">${plantel("sidgad-roster-home-name", "JUVENTUDE PACENSE", jl(1, true, "SHEHDA", "ÀLVARO") + jl(74, false, "GUIMARÃES DA SILVA", "JOÃO CARLOS") + jl(9, false, "MICCOLI", "ALESSANDRO"), tc("D", "SOUSA, TIAGO") + tc("E1", "AZEVEDO, HUGO"))}${plantel("sidgad-roster-away-name", "UD OLIVEIRENSE", jl(10, true, "GRAU-TALLADA", "MARC") + jl(7, false, "DI BENEDETTO", "CARLO"), tc("E1", "ARES LOZANO, RICARDO"))}</div>
<div class="sidgad-incidents-container" id="sidgad-incidents-list"><div class="sidgad-mob-period-header"><span>PERIOD 2</span></div>
${remate(2, "00:15", "dfh", "140.png", "JUVENTUDE PACENSE", 9, "MICCOLI, ALESSANDRO", "NO GOAL")}${falta(2, "00:15", 10, "141.png", "UD OLIVEIRENSE")}${pausa(2, "05:44", "141.png", "UD OLIVEIRENSE")}${golo(2, "05:44", "3 - 2", "140.png", "JUVENTUDE PACENSE", 74, "GUIMARÃES DA SILVA, JOÃO CARLOS")}${azul(2, "16:31", "141.png", "UD OLIVEIRENSE", 7, "DI BENEDETTO, CARLO")}${golo(2, "22:50", "2 - 2", "141.png", "UD OLIVEIRENSE", 7, "DI BENEDETTO, CARLO")}${remate(2, "22:50", "pen", "141.png", "UD OLIVEIRENSE", 7, "DI BENEDETTO, CARLO", "GOAL")}
<div class="sidgad-mob-period-header"><span>PERIOD 1</span></div>
${golo(1, "04:10", "2 - 1", "141.png", "UD OLIVEIRENSE", 10, "GRAU-TALLADA, MARC")}${falta(1, "07:19", 1, "140.png", "JUVENTUDE PACENSE")}${golo(1, "17:48", "2 - 0", "140.png", "JUVENTUDE PACENSE", 74, "GUIMARÃES DA SILVA, JOÃO CARLOS")}${golo(1, "23:24", "1 - 0", "140.png", "JUVENTUDE PACENSE", 9, "MICCOLI, ALESSANDRO")}</div>`;
if (new URLSearchParams(location.search).get("partido")) setTimeout(() => { const m = document.createElement("div"); m.className = "sidgad-match-modal"; m.innerHTML = FICHA; document.body.appendChild(m); }, 400);
const q = new URLSearchParams(location.search), main = document.getElementById("sidgad-liga-main-content");
function pintar() {
  const q = new URLSearchParams(location.search), liga = q.get("liga"), vista = q.get("vista");
  document.getElementById("home").innerHTML = liga ? "" : Object.entries(LIGAS).map(([id, t]) => `<button class="sidgad-liga-card" data-season-id="41" data-l="${id}"><img src="https://sidgad.cloud/worldskate/images/logos_competiciones/${id}.png" class="sidgad-liga-logo" alt=""><div class="sidgad-liga-info"><div class="sidgad-liga-titulo">${t}</div></div></button>`).join("") + `<button class="sidgad-liga-card sidgad-oculto" data-season-id="39" data-l="234"><img class="sidgad-liga-logo" src="x/logos_competiciones/234.png"><div class="sidgad-liga-titulo">WSE CHAMPIONS LEAGUE MEN</div></button>`;
  document.querySelectorAll(".sidgad-liga-card").forEach(b => b.onclick = () => { history.pushState(null, "", "?liga=" + b.dataset.l); pintar(); });
  main.innerHTML = "";
  if (!liga || !vista) return;
  setTimeout(() => { // os dados chegam depois, como no site verdadeiro
    if (vista === "calendar") main.innerHTML = CAL[liga] ? `<div class="sidgad-calendario-scroll"><table class="sidgad-calendario-table">${CAL[liga]}</table></div>` : `<p class="sidgad-empty-state">Fixtures not available yet.</p>`;
    else main.innerHTML = CLS[liga] || `<p class="sidgad-empty-state">Standings not available yet.</p>`;
  }, 350);
}
addEventListener("popstate", pintar); pintar();
</script>
