name: Atualizar dados do hp.fpp.pt

on:
  schedule:
    # Horas em UTC (Portugal = UTC no inverno, UTC+1 no verão).
    - cron: "*/10 9-23 * * *"   # de 10 em 10 min entre as 9h e as 24h: horas dos jogos (e das notificações)
    - cron: "7 0-8 * * *"       # de hora a hora durante a noite
    - cron: "17 5 * * *"        # 1x por dia às 05:17: competições novas e plantéis completos
    # NOTA: num repositório PÚBLICO o GitHub Actions é grátis e ilimitado.
    # Num repositório PRIVADO tens ~2000 min/mês grátis: troca "*/10" por "*/30".
  workflow_dispatch:          # botão "Run workflow" para correr à mão
    inputs:
      modo:
        description: "rapido ou completo"
        required: true
        default: "completo"

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Correr o robô
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          MODO="rapido"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODO="${{ github.event.inputs.modo }}"; fi
          if [ "${{ github.event.schedule }}" = "17 5 * * *" ]; then MODO="completo"; fi
          python scraper/scrape.py "$MODO"
